upstream vproapp {
    server tomcat:8080;
}
server {
    listen 8080;
    location /nginx-health { return 200 'ok'; add_header Content-Type text/plain; }
    location / {
        proxy_pass http://vproapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
